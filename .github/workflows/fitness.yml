name: fitness-functions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  arquitectura:
    name: Fitness Functions y Verificación Arquitectónica
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install import-linter pytest matplotlib

      - name: Ejecutar Fitness Functions Estructurales (import-linter)
        run: |
          lint-imports

      - name: Ejecutar Fitness Functions de Calidad y Pruebas Unitarias (pytest)
        run: |
          pytest -v tests/test_fitness.py
          pytest -v tests/test_patrones.py tests/test_comportamiento.py
