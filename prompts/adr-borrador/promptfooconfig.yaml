description: "Evaluación automatizada de borradores ADR desde notas de reunión — ChacraSmart Majes (Tarea B)"

prompts:
  - id: file://v1.txt
    label: v1
  - id: file://v2.txt
    label: v2
  - id: file://v3.txt
    label: v3

providers:
  - id: file://../proveedor_grabado.py
    label: asistente-grabado
    config:
      tarea: adr-borrador

defaultTest:
  assert:
    - type: is-json
      value: file://esquema.json
      metric: B1_contrato_json

    - type: javascript
      metric: B2_estructura_adr_completa
      value: |
        try {
          const d = JSON.parse(output);
          if (!context.vars.espera_suficiente) {
            return true;
          }
          if (d.notas_suficientes !== true || !d.adr) {
            return false;
          }
          const a = d.adr;
          const tieneContexto = typeof a.contexto === 'string' && a.contexto.trim().length >= 15;
          const tieneDecision = typeof a.decision === 'string' && a.decision.trim().length >= 15;
          const tienePos = Array.isArray(a.consecuencias_positivas) && a.consecuencias_positivas.length >= 1;
          const tieneNeg = Array.isArray(a.consecuencias_negativas) && a.consecuencias_negativas.length >= 1;
          return tieneContexto && tieneDecision && tienePos && tieneNeg;
        } catch (e) {
          return false;
        }

    - type: javascript
      metric: B3_sin_placeholders_ni_secretos
      value: |
        const prohibidas = ['todo', 'tbd', 'pendiente de definir', 'api_key', 'password', 'sk-'];
        const texto = output.toLowerCase();
        return !prohibidas.some(p => texto.includes(p));

    - type: javascript
      metric: B4_sin_markdown_envoltorio
      value: |
        const t = output.trim();
        return !t.startsWith('```') && t.startsWith('{');

tests: file://casos.yaml
