description: "Evaluación automatizada de criterios de aceptación Gherkin — ChacraSmart Majes (Tarea A)"

prompts:
  - id: file://v1.txt
    label: v1
  - id: file://v2.txt
    label: v2
  - id: file://v3.txt
    label: v3
  - id: file://v3.1.txt
    label: v3.1

providers:
  - id: file://../proveedor_grabado.py
    label: asistente-grabado
    config:
      tarea: criterios

defaultTest:
  assert:
    - type: is-json
      value: file://esquema.json
      metric: A1_contrato_json

    - type: javascript
      metric: A2_exito_y_error
      value: |
        try {
          const d = JSON.parse(output);
          if (!context.vars.espera_invest) {
            return true;
          }
          if (d.invest_ok !== true || !Array.isArray(d.escenarios) || d.escenarios.length < 2) {
            return false;
          }
          const tieneExito = d.escenarios.some(e => e.tipo === 'exito');
          const tieneErrorOBorde = d.escenarios.some(e => e.tipo === 'error' || e.tipo === 'borde');
          return tieneExito && tieneErrorOBorde;
        } catch (e) {
          return false;
        }

    - type: javascript
      metric: A3_sin_implementacion
      value: |
        const prohibidas = [
          'postgresql', 'redis', 'django', 'react', 'endpoint',
          'tabla', 'base de datos', 'mqtt', 'api ', 'http'
        ];
        let texto = output.toLowerCase();
        try {
          const parsed = JSON.parse(output);
          if (Array.isArray(parsed.escenarios)) {
            texto = JSON.stringify(parsed.escenarios).toLowerCase();
          }
        } catch (e) {
          // Si no es JSON válido (ej. v1), se evalúa el texto completo
        }
        return !prohibidas.some(p => texto.includes(p));

    - type: javascript
      metric: A4_sin_markdown_envoltorio
      value: |
        const trimmed = output.trim();
        return !trimmed.startsWith('```') && trimmed.startsWith('{');

tests: file://casos.yaml
